name: Update from wiki

on:
  schedule:
    - cron: '17 4 * * *'   # every day at 04:17 UTC
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and convert the wiki databases
        run: python3 update.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Wiki unchanged, nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update from wiki ($(date -u +%Y-%m-%d))"
          git push
